
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-petclinic
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spring-petclinic
  template:
    metadata:
      labels:
        app: spring-petclinic
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: spring-petclinic
              topologyKey: kubernetes.io/hostname
      containers:
        - name: spring-petclinic
          image: ruth89y7/spring-petclinic-rest:4
          ports:
            - containerPort: 9966
          startupProbe:
            httpGet:
              path: /petclinic/actuator/health
              port: 9966
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /petclinic/actuator/health
              port: 9966
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /petclinic/actuator/health
              port: 9966
            periodSeconds: 20
